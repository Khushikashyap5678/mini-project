{% macro icon(name, size=20) -%}
<svg class="icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'cap' %}<path d="m2 10 10-5 10 5-10 5-10-5Zm4 2v5c3 3 9 3 12 0v-5m4-2v6"/>
{%- elif name == 'grid' %}<rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>
{%- elif name == 'calendar' %}<rect x="3.5" y="5.5" width="17" height="15" rx="2.5"/><path d="M7.5 3.5v4m9-4v4m-13 3h17m-13 4h2m3 0h2m-7 3h2"/>
{%- elif name == 'bell' %}<path d="M18 8a6 6 0 0 0-12 0c0 8-2 8-2 9h16c0-1-2-1-2-9M10 21h4"/>
{%- elif name == 'clock' %}<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>
{%- elif name == 'book' %}<path d="M12 6c-3-2-6-2.5-9-1v14c3-1.5 6-1 9 1 3-2 6-2.5 9-1V5c-3-1.5-6-1-9 1Zm0 0v14"/>
{%- elif name == 'briefcase' %}<rect x="3" y="8" width="18" height="12" rx="2"/><path d="M8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13a25 25 0 0 0 18 0m-9 0v3"/>
{%- elif name == 'library' %}<path d="M4 19h16M5 8l7-4 7 4H5Zm2 3v5m5-5v5m5-5v5"/>
{%- elif name == 'plus' %}<path d="M12 5v14M5 12h14"/>
{%- elif name == 'arrow' %}<path d="M4 12h15m-6-6 6 6-6 6"/>
{%- elif name == 'left' %}<path d="m14 6-6 6 6 6"/>
{%- elif name == 'right' %}<path d="m10 6 6 6-6 6"/>
{%- elif name == 'search' %}<circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 4 4"/>
{%- elif name == 'edit' %}<path d="m4 16-1 5 5-1L20 8l-4-4L4 16Zm10-10 4 4"/>
{%- elif name == 'download' %}<path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"/>
{%- elif name == 'close' %}<path d="m6 6 12 12M18 6 6 18"/>
{%- elif name == 'check' %}<path d="m5 12 4 4L19 6"/>
{%- elif name == 'menu' %}<path d="M4 6h16M4 12h16M4 18h16"/>
{%- elif name == 'spark' %}<path d="M12 2c0 6 4 10 10 10-6 0-10 4-10 10 0-6-4-10-10-10 6 0 10-4 10-10Z"/>
{%- endif %}
</svg>
{%- endmacro %}
